<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Name Website</title>

<style>
body{
    font-family:Arial;
    text-align:center;
    margin:0;
}

#welcomeScreen{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

#mainContent{
    display:none;
    margin-top:100px;
}

button{
    padding:12px 25px;
    font-size:18px;
    cursor:pointer;
}
</style>

</head>
<body>

<!-- Welcome Screen -->

<div id="welcomeScreen">

    <h1>Welcome curious JIYA 😊</h1>

    <p>कुछ अलग देखने के लिए Curious पर क्लिक करें</p>

    <button onclick="startWebsite()">
        Continue
    </button>

</div>

<!-- Main Content -->

<div id="mainContent">

    <h3>
        आपने इतना समय दिया, इसलिए मैंने सोचा कि नाम को कुछ अलग और खास तरीके से प्रस्तुत किया जाए।
        इसमें थोड़ा समय अवश्य लगा, आपके द्वारा दिए गए समय के बराबर तो नहीं,
        पर कुछ अलग तरीके से बताया जाए। 😊
    </h3>

    <button onclick="showName()">
        Click Here
    </button>

    <h1 id="result"></h1>

</div>

<div id="player"></div>

<script>

function startWebsite(){

    // Welcome हटाओ
    document.getElementById("welcomeScreen").style.display="none";

    // Main Content दिखाओ
    document.getElementById("mainContent").style.display="block";

    // Music Start
    document.getElementById("player").innerHTML = `
        <iframe
            width="0"
            height="0"
            src="https://www.youtube.com/embed/wTgrZE9RWNY?autoplay=1&loop=1&playlist=wTgrZE9RWNY"
            allow="autoplay"
        ></iframe>
    `;
}

function showName(){

    document.getElementById("result").innerText = "Pawan";

}
    function showName(){

    document.getElementById("result").innerHTML = `
        <h1>Pawan</h1>

        <p style="max-width:800px; margin:20px auto; line-height:1.8; font-size:18px;">
            अब बैच के लोगों से कोई सवाल नहीं है। एक और व्यक्ति का जवाब आया,
            कसम से रुला ही दिया। ऐसी बातें कीं कि आपने वेटिंग लिस्ट में ऐसा डाल दिया
            कि दुबारा रिस्पॉन्ड ही नहीं किया...

            खैर, आपकी बातें और व्यवहार मुझे अच्छे लगे।
            विषय पर थोड़ा चर्चा हो जाता तो शायद थोड़ी शांति मिल जाती,
            क्योंकि आपसे पूछ भी लिया है, तो बिना जाने शांति कहाँ मिलती है। 😊
        </p>
    `;

}

</script>
   

</body>
</html>
